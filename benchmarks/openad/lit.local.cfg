# The OpenAD shallow water example is built from these sources, in this order
# so that each module is compiled before its users. Its directory also holds
# sources that must not be linked in: OpenAD's own drivers (main.F and the
# transformed main.prepped.F), OpenAD's run time support (OADrts), and a
# second, smaller grid size module (size_small.f90).
shallow_water_sources = [
    'adsize.f90', 'size.f90', 'parms.f90', 'vars.f90', 'pfields.f90',
    'force.f90', 'data.f90', 'weights.f90', 'mini.f90',
    'inifields.F', 'readparms.F', 'iowrapper.F', 'read_data.F',
    'make_weights.F', 'map_control_vector.F', 'small_routines_split.F',
    'small_routines_joint.F', 'cost_function.F', 'cost_depth.F',
    'loop_body_wrapper_inner.F', 'loop_body_wrapper_outer.F',
    'forward_model.F', 'ionetcdf.F',
]
config.substitutions.insert(0, (
    '%shallow_water_sources',
    ' '.join(config.openad_examples + '/ShallowWater/' + source
             for source in shallow_water_sources)))
